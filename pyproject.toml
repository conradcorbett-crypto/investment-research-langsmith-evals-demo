[project]
name = "investment-research-langsmith-evals-demo"
version = "0.1.0"
description = "LangSmith evaluation walkthrough for a fictional investment research assistant"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "langsmith>=0.3.0",
    "openai>=1.40.0",
]

[project.scripts]
upload-experiment = "upload_experiment:main"
evaluate-research-quality = "evaluate_research_quality:main"
evaluate-escalation-accuracy = "evaluate_escalation_accuracy:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "upload_experiment",
    "evaluate_research_quality",
    "evaluate_escalation_accuracy",
    "eval_common",
]

[tool.setuptools.packages.find]
include = ["evaluators*"]
